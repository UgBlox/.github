name: Feature
description: Propose new behavior or API.
labels: [feat]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today, and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
